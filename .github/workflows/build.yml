name: Gradle Build, Test, and Analyze
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - "docs/**"
      - ".github/workflows/build.yml"
      - ".idea/**"
      - ".sonarlint/**"
      - ".run/**"
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".github/workflows/build.yml"
      - ".idea/**"
      - ".sonarlint/**"
      - ".run/**"
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: [ self-hosted, no-dind, internal ]
    timeout-minutes: 25 # Builds running longer than 25 minutes should be investigated
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Log in to GitHub Container Registry # To workaround rate-limiting when pulling images via test containers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${{ env.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set up JDK 21
        uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@bfd569614358980afc8f89c2730eee75bb97efdf

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build codeCoverageReport sonar --stacktrace

      - name: Upload build reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ failure() }} # only store logs if build fails
        with:
          name: Build Reports
          path: '**/build/reports'
          if-no-files-found: ignore
